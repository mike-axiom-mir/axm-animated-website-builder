name: Verify builder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - name: Generate standalone review site
        run: node scripts/write-example-export.mjs

      - name: Install screenshot browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start review servers
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/axm-builder-preview.log 2>&1 &
          echo $! > /tmp/axm-builder-preview.pid
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/axm-standalone-preview.log 2>&1 &
          echo $! > /tmp/axm-standalone-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null && curl --fail --silent http://127.0.0.1:4174/preview/published.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/axm-builder-preview.log
          cat /tmp/axm-standalone-preview.log
          exit 1

      - name: Capture builder and published screenshots
        run: |
          mkdir -p review-screenshots
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,1024"             --wait-for-timeout 1200             --full-page             http://127.0.0.1:4173/             review-screenshots/builder-desktop-1440x1024.png
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "390,844"             --wait-for-timeout 1200             --full-page             http://127.0.0.1:4173/             review-screenshots/builder-phone-390x844.png
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,1024"             --wait-for-timeout 1200             --full-page             http://127.0.0.1:4174/preview/published.html             review-screenshots/published-desktop-1440x1024.png
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "390,844"             --wait-for-timeout 1200             --full-page             http://127.0.0.1:4174/preview/published.html             review-screenshots/published-phone-390x844.png
          npx --yes playwright@1.55.0 screenshot             --browser chromium             --viewport-size "1440,1024"             --wait-for-timeout 1800             --full-page             http://127.0.0.1:4174/preview/published.html#workshop             review-screenshots/published-workshop-1440x1024.png

      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: builder-visual-review
          path: review-screenshots/*.png
          if-no-files-found: error
